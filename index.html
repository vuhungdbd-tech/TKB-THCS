<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ứng dụng sắp xếp TKB</title>
    <meta name="description" content="Ứng dụng sắp xếp và quản lý thời khóa biểu thông minh cho trường học" />
    <meta property="og:title" content="Ứng dụng sắp xếp TKB" />
    <meta property="og:description" content="Ứng dụng sắp xếp và quản lý thời khóa biểu thông minh cho trường học" />
    <script>
      (function() {
        function silence(e) {
          if (e) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          }
        }
        window.addEventListener('unhandledrejection', function(event) {
          silence(event);
        }, true);
        window.addEventListener('error', function(event) {
          if (!event.message || event.message === 'Script error.' || !event.error || (typeof event.error === 'object' && Object.keys(event.error).length === 0)) {
            silence(event);
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
